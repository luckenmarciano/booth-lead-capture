name: Deploy to VPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy App via Docker on VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Masuk ke direktori proyek di VPS atau clone jika belum ada
            if [ ! -d "/home/${{ secrets.VPS_USERNAME }}/booth-lead-capture" ]; then
              git clone ${{ github.server_url }}/${{ github.repository }}.git /home/${{ secrets.VPS_USERNAME }}/booth-lead-capture
            fi
            
            cd /home/${{ secrets.VPS_USERNAME }}/booth-lead-capture
            git pull origin ${{ github.ref_name }}
            
            # Build dan jalankan ulang container Docker
            docker compose down
            docker compose build --no-cache
            docker compose up -d
            
            # Cek status kesehatan container
            docker compose ps
            echo "🚀 Aplikasi Booth Lead Capture berhasil di-deploy ke VPS!"
