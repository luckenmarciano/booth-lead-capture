version: '3.8'

services:
  booth-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booth-lead-capture
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/app/data
    volumes:
      - booth_data:/app/data
    networks:
      - default
      - gladhy_default
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  gladhy_default:
    external: true

volumes:
  booth_data:
    name: booth_lead_capture_data
